spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradewise_ai}
    username: ${DB_USERNAME:tradewise_app}
    password: ${DB_PASSWORD:local-dev-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration